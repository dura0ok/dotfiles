- defaults:
    link:
      relink: true
    shell:
      stdout: true
      stderr: true

- omnipkg:
    - install:
        - zsh
        - git
        - curl
        - wget
        - ca-certificates
        - direnv
        - fzf
        - ripgrep
        - bat
        - tmux
        - mosh
        - { dnf: python3-tmuxp, apt: tmuxp }
        - btop
        - htop
        - { dnf: iotop-c, apt: iotop-c, pac: iotop-c }
        - lazygit
        - { brew: lazydocker }
        - coreutils
        - { apt: unp, pac: unp, brew: unp }
        - asciinema
        - { dnf: task, apt: taskwarrior, pac: task, brew: task }
        - { dnf: fd, apt: fd-find }
        - { dnf: duf, apt: duf }
        - eza
        - tldr
        - pv
        - ipcalc

- omnipkg:
    - install:
        - cargo
        - { dnf: openssl-devel, apt: libssl-dev }
        - { dnf: libcurl-devel, apt: libcurl4-openssl-dev }
        - { dnf: libpq-devel, apt: libpq-dev }
        - { dnf: libssh-devel, apt: libssh-dev }
        - { dnf: lz4-devel, apt: liblz4-dev }
        - { dnf: libzstd-devel, apt: libzstd-dev }
        - { dnf: libicu-devel, apt: libicu-dev }
        - { dnf: readline-devel, apt: libreadline-dev }
        - { dnf: zlib-devel, apt: zlib1g-dev }
        - { dnf: pkgconf-pkg-config, apt: pkg-config }
        - { dnf: leveldb-devel, apt: libleveldb-dev }
        - fuse3
        - { dnf: fuse3-devel, apt: libfuse3-dev }
        - make
        - flex
        - bison
        - meson
        - cmake
        - { dnf: CUnit-devel, apt: libcunit1-dev }
        - { dnf: gcc-c++, apt: g++ }
        - perl
        - { dnf: perl-Test-Harness, apt: libtest-harness-perl }
        - { dnf: perl-devel, apt: libperl-dev }
        - { dnf: boost-devel, apt: libboost-all-dev }
        - { dnf: boost-static }

- omnipkg:
    - install:
        - gdb
        - python3-pygments
        - python3-pip
        - pipx
        - [fira-code-fonts, fonts-firacode]

- omnipkg:
    - install:
        - { dnf: niri }
        - { dnf: waybar }
        - mako
        - fuzzel
        - swaybg
        - swaylock
        - grim
        - slurp
        - wl-clipboard
        - { dnf: libcanberra-gtk3, apt: libcanberra-gtk3-module }
        - playerctl
        - brightnessctl
        - jq
        - flatpak
        - { dnf: blueman }
        - { dnf: nm-connection-editor }
        - { dnf: gnome-calendar }
        - { dnf: nautilus }
        - { dnf: firefox }

- link:
    ~/.zshrc: zsh/zshrc
    ~/.gdbinit: gdb/.gdbinit
    ~/.config/Code/User/settings.json:
      path: vscode/settings.json
      create: true
      backup: true
    ~/.config/Code/User/keybindings.json:
      path: vscode/keybindings.json
      create: true
      backup: true
    ~/.config/Cursor/User/settings.json:
      path: vscode/settings.json
      create: true
      backup: true
    ~/.config/Cursor/User/keybindings.json:
      path: vscode/keybindings.json
      create: true
      backup: true
    ~/.config/ghostty/config.ghostty:
      path: ghostty/config.ghostty
      create: true
      backup: true
    ~/.config/ghostty/themes/catppuccin-latte.conf:
      path: ghostty/catppuccin/themes/catppuccin-latte.conf
      create: true
      backup: true
    ~/.config/ghostty/themes/catppuccin-frappe.conf:
      path: ghostty/catppuccin/themes/catppuccin-frappe.conf
      create: true
      backup: true
    ~/.config/tmux/tmux.conf:
      path: tmux/tmux.conf
      create: true
      backup: true
    ~/.tmux.conf:
      path: tmux/tmux.conf
      create: true
      backup: true
    ~/.config/tmux/tmux.conf.local:
      path: tmux/tmux.conf.local
      create: true
      backup: true
    ~/.config/niri/config.kdl:
      path: niri/config.kdl
      create: true
      backup: true
    ~/.config/niri/input.kdl:
      path: niri/input.kdl
      create: true
      backup: true
    ~/.config/niri/outputs.kdl:
      path: niri/outputs.kdl
      create: true
      backup: true
    ~/.config/niri/layout.kdl:
      path: niri/layout.kdl
      create: true
      backup: true
    ~/.config/niri/startup.kdl:
      path: niri/startup.kdl
      create: true
      backup: true
    ~/.config/niri/window-rules.kdl:
      path: niri/window-rules.kdl
      create: true
      backup: true
    ~/.config/niri/binds.kdl:
      path: niri/binds.kdl
      create: true
      backup: true
    ~/.config/niri/ws-presets.kdl:
      path: niri/ws-presets.kdl
      create: true
      backup: true
    ~/.config/waybar/config.jsonc:
      path: waybar/config.jsonc
      create: true
      backup: true
    ~/.config/waybar/config:
      path: waybar/config.jsonc
      create: true
      backup: true
    ~/.config/waybar/style.css:
      path: waybar/style.css
      create: true
      backup: true
    ~/.config/mako/config:
      path: mako/config
      create: true
      backup: true
    ~/.local/bin/niri-ws-menu:
      path: bin/niri-ws-menu
      create: true
      backup: true
    ~/.local/bin/session-menu:
      path: bin/session-menu
      create: true
      backup: true
    ~/.local/bin/audio-settings:
      path: bin/audio-settings
      create: true
      backup: true

- shell:
    - command: bash scripts/install-tmux-tpm.sh
    - command: bash scripts/install-ghostty.sh
    - command: bash scripts/install-sublime-text.sh
    - command: bash scripts/install-nvm.sh
    - command: bash scripts/install-branchlet.sh
    - command: bash scripts/install-delta.sh
    - command: bash scripts/install-go.sh
    - command: bash scripts/install-worktrunk.sh
    - command: bash scripts/install-vscode.sh
    - command: bash scripts/install-vscode-extensions.sh
    - command: bash scripts/install-docker.sh
    - command: bash scripts/install-lazydocker.sh
    - command: bash scripts/install-agg.sh
    - command: bash scripts/install-unp-linux.sh
    - command: bash scripts/install-lnav.sh
    - command: bash scripts/install-niri-desktop.sh
    - command: bash scripts/chsh-zsh-if-needed.sh
