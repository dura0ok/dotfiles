log_level = "warn"
position = "Top"
layer = "Top"

[modules]
left = ["Workspaces"]
center = ["Tempo"]
right = ["KeyboardLayout", ["Tray", "Privacy", "Settings"]]

[workspaces]
visibility_mode = "All"
enable_workspace_filling = false

[keyboard_layout.labels]
"English (US)" = "EN"
"Russian" = "RU"

[tempo]
clock_format = "%a %b %-d  %H:%M"
weather_indicator = "None"

[settings]
lock_cmd = "niri-lock"
logout_cmd = "niri msg action quit --skip-confirmation"
audio_sinks_more_cmd = "audio-settings"
audio_sources_more_cmd = "audio-settings"
wifi_more_cmd = "nm-connection-editor"
vpn_more_cmd = "nm-connection-editor"
bluetooth_more_cmd = "blueman-manager"
battery_format = "Icon"
audio_indicator_format = "Icon"
brightness_indicator_format = "Icon"
network_indicator_format = "Icon"
bluetooth_indicator_format = "Icon"
microphone_indicator_format = "Icon"
indicators = [
  "IdleInhibitor",
  "PowerProfile",
  "Network",
  "Bluetooth",
  "Vpn",
  "Audio",
  "Microphone",
  "Brightness",
  "Battery",
]

[osd]
enabled = true
timeout = 1500

[appearance]
style = "Solid"
opacity = 1.0
scale_factor = 1.1
success_color = "#33d17a"
warning_color = "#f6d32d"
danger_color = "#e01b24"
text_color = "#ffffff"
workspace_colors = ["#ffffff"]

[appearance.primary_color]
base = "#3584e4"
weak = "#62a0ea"
strong = "#1c71d8"
text = "#ffffff"

[appearance.background_color]
base = "#1e1e1e"
weak = "#303030"
strong = "#3d3d3d"
text = "#ffffff"

[appearance.secondary_color]
base = "#141414"
strong = "#1e1e1e"

[appearance.menu]
opacity = 1.0
