- defaults:
    link:
      relink: true
    shell:
      stdout: true
      stderr: true

- omnipkg:
    - install:
        - { dnf: niri }
        - { dnf: SwayNotificationCenter, apt: sway-notification-center, pac: swaync }
        - fuzzel
        - swaybg
        - swaylock
        - { dnf: gtklock }
        - grim
        - slurp
        - wl-clipboard
        - { dnf: libcanberra-gtk3, apt: libcanberra-gtk3-module }
        - playerctl
        - jq
        - flatpak
        - { dnf: blueman }
        - { dnf: nm-connection-editor }
        - { dnf: nautilus }
        - { dnf: firefox }
        - { dnf: gnome-control-center }

- link:
    ~/.config/niri/config.kdl:
      path: niri/config.kdl
      create: true
      backup: true
    ~/.config/niri/input.kdl:
      path: niri/input.kdl
      create: true
      backup: true
    ~/.config/niri/outputs.kdl:
      path: niri/outputs.kdl
      create: true
      backup: true
    ~/.config/niri/layout.kdl:
      path: niri/layout.kdl
      create: true
      backup: true
    ~/.config/niri/startup.kdl:
      path: niri/startup.kdl
      create: true
      backup: true
    ~/.config/niri/window-rules.kdl:
      path: niri/window-rules.kdl
      create: true
      backup: true
    ~/.config/niri/binds.kdl:
      path: niri/binds.kdl
      create: true
      backup: true
    ~/.config/niri/ws-presets.kdl:
      path: niri/ws-presets.kdl
      create: true
      backup: true
    ~/.config/ashell/config.toml:
      path: ashell/config.toml
      create: true
      backup: true
    ~/.config/swaync/config.json:
      path: swaync/config.json
      create: true
      backup: true
    ~/.config/swaync/style.css:
      path: swaync/style.css
      create: true
      backup: true
    ~/.config/fuzzel/fuzzel.ini:
      path: fuzzel/fuzzel.ini
      create: true
      backup: true
    ~/.config/gtklock/config.ini:
      path: gtklock/config.ini
      create: true
      backup: true
    ~/.config/gtklock/style.css:
      path: gtklock/style.css
      create: true
      backup: true
    ~/.local/bin/niri-focus:
      path: bin/niri-focus
      create: true
      backup: true
    ~/.local/bin/gnome-settings:
      path: bin/gnome-settings
      create: true
      backup: true
    ~/.local/bin/niri-ws-menu:
      path: bin/niri-ws-menu
      create: true
      backup: true
    ~/.local/bin/niri-wallpaper:
      path: bin/niri-wallpaper
      create: true
      backup: true
    ~/.local/bin/niri-lock:
      path: bin/niri-lock
      create: true
      backup: true
    ~/.local/bin/audio-settings:
      path: bin/audio-settings
      create: true
      backup: true
    ~/.local/share/applications/org.gnome.Settings.desktop:
      path: applications/org.gnome.Settings.desktop
      create: true
      backup: true

- shell:
    - command: bash scripts/install-niri-desktop.sh
    - command: systemctl --user enable --now swaync.service
    - command: bash scripts/install-ashell.sh
